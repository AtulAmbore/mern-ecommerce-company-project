# version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: backend_api
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    env_file:
      - ./server/.env

  client:
    build: ./client
    container_name: react_client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo-data:
